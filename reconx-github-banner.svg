<svg viewBox="0 0 2000 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A1E2E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F1419;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1E2E;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F0C3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00FFCC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F0C3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="radarGlow">
      <stop offset="0%" style="stop-color:#00F0C3;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00F0C3;stop-opacity:0" />
    </radialGradient>
    
    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Patterns -->
    <pattern id="radarGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0C3" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    
    <pattern id="techPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#00F0C3" opacity="0.2"/>
      <circle cx="0" cy="0" r="1" fill="#00F0C3" opacity="0.15"/>
      <circle cx="60" cy="0" r="1" fill="#00F0C3" opacity="0.15"/>
      <circle cx="0" cy="60" r="1" fill="#00F0C3" opacity="0.15"/>
      <circle cx="60" cy="60" r="1" fill="#00F0C3" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="2000" height="450" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid overlay -->
  <rect width="2000" height="450" fill="url(#radarGrid)"/>
  
  <!-- Tech pattern overlays -->
  <rect x="0" y="0" width="500" height="450" fill="url(#techPattern)" opacity="0.5"/>
  <rect x="1500" y="0" width="500" height="450" fill="url(#techPattern)" opacity="0.5"/>
  
  <!-- Animated scanning lines -->
  <line x1="0" y1="80" x2="2000" y2="80" stroke="#00F0C3" stroke-width="1.5" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="370" x2="2000" y2="370" stroke="#00FF88" stroke-width="1.5" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </line>
  
  <!-- Left side: Enhanced Radar Logo -->
  <g transform="translate(250, 225)">
    <!-- Outer radar glow -->
    <circle cx="0" cy="0" r="110" 
            fill="url(#radarGlow)" 
            opacity="0.3"/>
    
    <!-- Circular radar base -->
    <circle cx="0" cy="0" r="90" 
            fill="#0F1419" 
            opacity="0.9"/>
    
    <!-- Concentric radar circles -->
    <circle cx="0" cy="0" r="85" 
            fill="none" 
            stroke="#00F0C3" 
            stroke-width="1.5"
            opacity="0.4"
            filter="url(#glow)"/>
    <circle cx="0" cy="0" r="65" 
            fill="none" 
            stroke="#00F0C3" 
            stroke-width="1.5"
            opacity="0.4"/>
    <circle cx="0" cy="0" r="45" 
            fill="none" 
            stroke="#00F0C3" 
            stroke-width="1.5"
            opacity="0.4"/>
    <circle cx="0" cy="0" r="25" 
            fill="none" 
            stroke="#00F0C3" 
            stroke-width="1.5"
            opacity="0.4"/>
    
    <!-- Crosshair lines -->
    <line x1="-85" y1="0" x2="85" y2="0" 
          stroke="#00F0C3" 
          stroke-width="1.5"
          opacity="0.4"/>
    <line x1="0" y1="-85" x2="0" y2="85" 
          stroke="#00F0C3" 
          stroke-width="1.5"
          opacity="0.4"/>
    
    <!-- Central symbol - stylized RX -->
    <!-- R shape -->
    <path d="M -40,-30 L -40,30 M -40,-30 L -15,-30 Q -5,-30 -5,-20 Q -5,-10 -15,-10 L -40,-10 M -15,-10 L -5,30" 
          stroke="url(#neonCyan)" 
          stroke-width="5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#neonGlow)"/>
    
    <!-- X shape with scan effect -->
    <g transform="translate(20, 0)">
      <line x1="-25" y1="-30" x2="25" y2="30" 
            stroke="url(#neonCyan)" 
            stroke-width="5"
            stroke-linecap="round"
            filter="url(#neonGlow)"/>
      <line x1="25" y1="-30" x2="-25" y2="30" 
            stroke="url(#neonCyan)" 
            stroke-width="5"
            stroke-linecap="round"
            filter="url(#neonGlow)"/>
    </g>
    
    <!-- Target reticle at center -->
    <circle cx="0" cy="0" r="12" 
            fill="none" 
            stroke="#FFD700" 
            stroke-width="2.5"
            opacity="0.9"
            filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" 
            fill="#FFD700" 
            opacity="1"
            filter="url(#strongGlow)">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Corner markers -->
    <g transform="translate(-65, -65)">
      <line x1="0" y1="0" x2="15" y2="0" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="15" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(65, -65)">
      <line x1="0" y1="0" x2="-15" y2="0" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="15" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(-65, 65)">
      <line x1="0" y1="0" x2="15" y2="0" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-15" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(65, 65)">
      <line x1="0" y1="0" x2="-15" y2="0" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-15" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Scanning arc (animated) -->
    <path d="M 0,-85 A 85,85 0 0,1 60,-60" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="3"
          opacity="0.8"
          filter="url(#neonGlow)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="4s"
        repeatCount="indefinite"/>
    </path>
    
    <!-- Outer ring with notches -->
    <circle cx="0" cy="0" r="95" 
            fill="none" 
            stroke="url(#neonCyan)" 
            stroke-width="3"
            stroke-dasharray="5 10"
            opacity="0.7"
            filter="url(#glow)"/>
    
    <!-- Target blips (animated dots) -->
    <circle cx="50" cy="-30" r="3.5" fill="#FFD700" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-40" cy="50" r="3.5" fill="#00FF88" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="40" r="3.5" fill="#00F0C3" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
  
  <!-- Main title and tagline -->
  <text x="500" y="190" 
        font-family="'Roboto', 'Orbitron', 'Arial', sans-serif" 
        font-size="80" 
        font-weight="700" 
        fill="url(#textGlow)" 
        letter-spacing="8"
        filter="url(#strongGlow)">RECONX</text>
  
  <text x="500" y="250" 
        font-family="'Roboto', 'Arial', sans-serif" 
        font-size="28" 
        font-weight="300" 
        fill="#00F0C3" 
        letter-spacing="3"
        opacity="0.85">Automated Security Reconnaissance Framework</text>
  
  <!-- Enhanced accent line -->
  <line x1="500" y1="270" x2="1100" y2="270" 
        stroke="url(#neonCyan)" 
        stroke-width="2.5" 
        filter="url(#glow)"/>
  
  <!-- Decorative radar sweep indicators -->
  <g opacity="0.6">
    <circle cx="500" cy="285" r="3" fill="#FFD700" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="285" r="3" fill="#00FF88" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="285" r="3" fill="#00F0C3" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Right side: Enhanced Terminal window -->
  <g transform="translate(1200, 80)">
    <!-- Terminal glow background -->
    <rect x="-5" y="-5" width="710" height="300" 
          fill="#00F0C3" 
          opacity="0.05"
          rx="10"
          filter="url(#strongGlow)"/>
    
    <!-- Terminal background -->
    <rect x="0" y="0" width="700" height="290" 
          fill="#060a12" 
          stroke="#00F0C3" 
          stroke-width="2" 
          rx="8"
          opacity="0.95"/>
    
    <!-- Terminal header bar -->
    <rect x="0" y="0" width="700" height="40" 
          fill="url(#neonCyan)" 
          opacity="0.2"
          rx="8"/>
    
    <!-- Terminal buttons with glow -->
    <circle cx="25" cy="20" r="6" fill="#00FF88" opacity="0.8" filter="url(#glow)"/>
    <circle cx="50" cy="20" r="6" fill="#FFD700" opacity="0.7" filter="url(#glow)"/>
    <circle cx="75" cy="20" r="6" fill="#00F0C3" opacity="0.6" filter="url(#glow)"/>
    
    <!-- Terminal title -->
    <text x="100" y="27" 
          font-family="'Courier New', 'Consolas', monospace" 
          font-size="15" 
          fill="#00F0C3" 
          opacity="0.7"
          font-weight="bold">reconx@security-terminal:~$</text>
    
    <!-- Terminal content with enhanced styling -->
    <text x="25" y="75" 
          font-family="'Courier New', monospace" 
          font-size="15" 
          fill="#00FFCC" 
          font-weight="bold">$ reconx --target enterprise.local --stealth-mode</text>
    
    <text x="25" y="105" 
          font-family="'Courier New', monospace" 
          font-size="14" 
          fill="#00F0C3" 
          opacity="0.8">[✓] Initializing ReconX Intelligence Framework...</text>
    
    <text x="25" y="130" 
          font-family="'Courier New', monospace" 
          font-size="14" 
          fill="#00F0C3" 
          opacity="0.8">[✓] Radar sweep: Network topology mapped</text>
    
    <text x="25" y="155" 
          font-family="'Courier New', monospace" 
          font-size="14" 
          fill="#00F0C3" 
          opacity="0.8">[✓] Port scanner: 47 services identified</text>
    
    <text x="25" y="180" 
          font-family="'Courier New', monospace" 
          font-size="14" 
          fill="#00F0C3" 
          opacity="0.8">[✓] Subdomain enum: 156 domains discovered</text>
    
    <text x="25" y="205" 
          font-family="'Courier New', monospace" 
          font-size="14" 
          fill="#00F0C3" 
          opacity="0.8">[✓] Vulnerability scan: 23 potential vectors found</text>
    
    <text x="25" y="230" 
          font-family="'Courier New', monospace" 
          font-size="14" 
          fill="#FFD700" 
          font-weight="bold">[✓] Intelligence gathering complete</text>
    
    <text x="25" y="255" 
          font-family="'Courier New', monospace" 
          font-size="14" 
          fill="#00FF88" 
          font-weight="bold">    → Detailed report: ./recon-reports/scan_20240204.json</text>
    
    <!-- Blinking cursor with glow -->
    <rect x="25" y="265" width="14" height="20" fill="#00FFCC" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Tech UI corner brackets - Enhanced -->
  <g stroke="url(#neonCyan)" stroke-width="2.5" fill="none" opacity="0.5" filter="url(#glow)">
    <!-- Top left -->
    <path d="M 30 30 L 30 90 M 30 30 L 90 30"/>
    <line x1="30" y1="60" x2="60" y2="60" opacity="0.7"/>
    <circle cx="30" cy="30" r="3" fill="#00F0C3"/>
    
    <!-- Top right -->
    <path d="M 1970 30 L 1970 90 M 1970 30 L 1910 30"/>
    <line x1="1970" y1="60" x2="1940" y2="60" opacity="0.7"/>
    <circle cx="1970" cy="30" r="3" fill="#00F0C3"/>
    
    <!-- Bottom left -->
    <path d="M 30 420 L 30 360 M 30 420 L 90 420"/>
    <line x1="30" y1="390" x2="60" y2="390" opacity="0.7"/>
    <circle cx="30" cy="420" r="3" fill="#00F0C3"/>
    
    <!-- Bottom right -->
    <path d="M 1970 420 L 1970 360 M 1970 420 L 1910 420"/>
    <line x1="1970" y1="390" x2="1940" y2="390" opacity="0.7"/>
    <circle cx="1970" cy="420" r="3" fill="#00F0C3"/>
  </g>
  
  <!-- Enhanced status indicators -->
  <g transform="translate(500, 350)">
    <!-- Status 1 -->
    <circle cx="0" cy="0" r="5" fill="#00FFCC" filter="url(#strongGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="-2" y="-2" width="4" height="4" fill="none" stroke="#00FFCC" stroke-width="1" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="5" 
          font-family="'Courier New', monospace" 
          font-size="13" 
          fill="#00F0C3" 
          opacity="0.8"
          font-weight="bold">RADAR ACTIVE</text>
    
    <!-- Status 2 -->
    <circle cx="200" cy="0" r="5" fill="#FFD700" filter="url(#strongGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <rect x="198" y="-2" width="4" height="4" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 200 0" to="360 200 0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="218" y="5" 
          font-family="'Courier New', monospace" 
          font-size="13" 
          fill="#00F0C3" 
          opacity="0.8"
          font-weight="bold">SCANNING</text>
    
    <!-- Status 3 -->
    <circle cx="370" cy="0" r="5" fill="#00FF88" filter="url(#strongGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="368" y="-2" width="4" height="4" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 370 0" to="360 370 0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="388" y="5" 
          font-family="'Courier New', monospace" 
          font-size="13" 
          fill="#00F0C3" 
          opacity="0.8"
          font-weight="bold">AI ENABLED</text>
  </g>
  
  <!-- Subtle animated data streams -->
  <g opacity="0.15">
    <line x1="0" y1="180" x2="400" y2="180" stroke="#00F0C3" stroke-width="1.5" stroke-dasharray="8,8">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1600" y1="270" x2="2000" y2="270" stroke="#00FF88" stroke-width="1.5" stroke-dasharray="8,8">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="320" x2="350" y2="320" stroke="#FFD700" stroke-width="1" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Version tag -->
  <text x="1870" y="435" 
        font-family="'Courier New', monospace" 
        font-size="11" 
        fill="#00F0C3" 
        opacity="0.4"
        text-anchor="end">v2.5.0-beta</text>
</svg>
