<svg viewBox="0 0 2000 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#050810;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050810;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffcc;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffcc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Hexagon pattern -->
    <pattern id="hexPattern" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M30 0 L52 13 L52 39 L30 52 L8 39 L8 13 Z" 
            fill="none" 
            stroke="#00d4ff" 
            stroke-width="0.5" 
            opacity="0.15"/>
    </pattern>
    
    <!-- Grid pattern -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00d4ff" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="2000" height="450" fill="url(#bgGradient)"/>
  
  <!-- Grid overlay -->
  <rect width="2000" height="450" fill="url(#grid)"/>
  
  <!-- Hexagon pattern overlay (left and right) -->
  <rect x="0" y="0" width="400" height="450" fill="url(#hexPattern)" opacity="0.6"/>
  <rect x="1600" y="0" width="400" height="450" fill="url(#hexPattern)" opacity="0.6"/>
  
  <!-- Horizontal scanning lines -->
  <line x1="0" y1="50" x2="2000" y2="50" stroke="#00ffcc" stroke-width="1" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="400" x2="2000" y2="400" stroke="#00ffcc" stroke-width="1" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </line>
  
  <!-- Left side: Logo hexagon -->
  <g transform="translate(200, 225)">
    <!-- Outer glow hexagon -->
    <path d="M 0 -70 L 60 -35 L 60 35 L 0 70 L -60 35 L -60 -35 Z" 
          fill="none" 
          stroke="#00d4ff" 
          stroke-width="2" 
          opacity="0.2"/>
    
    <!-- Main hexagon -->
    <path d="M 0 -55 L 48 -27.5 L 48 27.5 L 0 55 L -48 27.5 L -48 -27.5 Z" 
          fill="none" 
          stroke="url(#neonBlue)" 
          stroke-width="3" 
          filter="url(#glow)"/>
    
    <!-- Inner X -->
    <line x1="-30" y1="-30" x2="30" y2="30" 
          stroke="#00ffcc" 
          stroke-width="5" 
          stroke-linecap="round"
          filter="url(#strongGlow)"/>
    <line x1="30" y1="-30" x2="-30" y2="30" 
          stroke="#00ffcc" 
          stroke-width="5" 
          stroke-linecap="round"
          filter="url(#strongGlow)"/>
    
    <!-- Center node -->
    <circle cx="0" cy="0" r="6" fill="#00d4ff" filter="url(#glow)"/>
    
    <!-- Radar rings -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00ffcc" stroke-width="1" opacity="0.15"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#00ffcc" stroke-width="1" opacity="0.2"/>
    
    <!-- Corner scan indicators -->
    <circle cx="48" cy="-27.5" r="3" fill="#00ffcc" opacity="0.6"/>
    <circle cx="48" cy="27.5" r="3" fill="#00ffcc" opacity="0.6"/>
    <circle cx="-48" cy="-27.5" r="3" fill="#00ffcc" opacity="0.6"/>
    <circle cx="-48" cy="27.5" r="3" fill="#00ffcc" opacity="0.6"/>
  </g>
  
  <!-- Main title -->
  <text x="400" y="200" 
        font-family="'Roboto', 'Arial', sans-serif" 
        font-size="72" 
        font-weight="700" 
        fill="url(#textGlow)" 
        letter-spacing="4"
        filter="url(#strongGlow)">ReconX</text>
  
  <!-- Subtitle -->
  <text x="400" y="260" 
        font-family="'Roboto', 'Arial', sans-serif" 
        font-size="32" 
        font-weight="300" 
        fill="#00d4ff" 
        letter-spacing="2"
        opacity="0.9">Automated Reconnaissance Framework</text>
  
  <!-- Accent line under text -->
  <line x1="400" y1="280" x2="900" y2="280" 
        stroke="url(#neonBlue)" 
        stroke-width="2" 
        filter="url(#glow)"/>
  
  <!-- Right side: Terminal window mockup -->
  <g transform="translate(1250, 100)">
    <!-- Terminal background -->
    <rect x="0" y="0" width="600" height="250" 
          fill="#060a12" 
          stroke="#00d4ff" 
          stroke-width="1.5" 
          rx="6"
          opacity="0.8"/>
    
    <!-- Terminal header bar -->
    <rect x="0" y="0" width="600" height="35" 
          fill="#00d4ff" 
          opacity="0.15"
          rx="6"/>
    
    <!-- Terminal buttons -->
    <circle cx="20" cy="17.5" r="5" fill="#00ffcc" opacity="0.7"/>
    <circle cx="40" cy="17.5" r="5" fill="#00ffcc" opacity="0.5"/>
    <circle cx="60" cy="17.5" r="5" fill="#00ffcc" opacity="0.3"/>
    
    <!-- Terminal title -->
    <text x="90" y="23" 
          font-family="'Courier New', monospace" 
          font-size="14" 
          fill="#00d4ff" 
          opacity="0.6">reconx@terminal:~</text>
    
    <!-- Terminal content -->
    <text x="20" y="70" 
          font-family="'Courier New', monospace" 
          font-size="14" 
          fill="#00ffcc" 
          opacity="0.9">$ reconx -t target.com --modules nmap,subenum,dirfuzz</text>
    
    <text x="20" y="100" 
          font-family="'Courier New', monospace" 
          font-size="13" 
          fill="#00d4ff" 
          opacity="0.7">[✓] Initializing ReconX Framework...</text>
    
    <text x="20" y="125" 
          font-family="'Courier New', monospace" 
          font-size="13" 
          fill="#00d4ff" 
          opacity="0.7">[✓] Nmap port scan: 4 services discovered</text>
    
    <text x="20" y="150" 
          font-family="'Courier New', monospace" 
          font-size="13" 
          fill="#00d4ff" 
          opacity="0.7">[✓] Subdomain enum: 23 subdomains found</text>
    
    <text x="20" y="175" 
          font-family="'Courier New', monospace" 
          font-size="13" 
          fill="#00d4ff" 
          opacity="0.7">[✓] Directory fuzzing: 147 endpoints located</text>
    
    <text x="20" y="210" 
          font-family="'Courier New', monospace" 
          font-size="14" 
          fill="#00ffcc" 
          font-weight="bold">[✓] Reconnaissance complete | Report: ./results/</text>
    
    <!-- Blinking cursor -->
    <rect x="20" y="220" width="12" height="18" fill="#00ffcc">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Tech UI elements - Top corners -->
  <g stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.4">
    <!-- Top left corner bracket -->
    <path d="M 30 30 L 30 80 M 30 30 L 80 30"/>
    <line x1="30" y1="55" x2="55" y2="55" opacity="0.6"/>
    
    <!-- Top right corner bracket -->
    <path d="M 1970 30 L 1970 80 M 1970 30 L 1920 30"/>
    <line x1="1970" y1="55" x2="1945" y2="55" opacity="0.6"/>
    
    <!-- Bottom left corner bracket -->
    <path d="M 30 420 L 30 370 M 30 420 L 80 420"/>
    <line x1="30" y1="395" x2="55" y2="395" opacity="0.6"/>
    
    <!-- Bottom right corner bracket -->
    <path d="M 1970 420 L 1970 370 M 1970 420 L 1920 420"/>
    <line x1="1970" y1="395" x2="1945" y2="395" opacity="0.6"/>
  </g>
  
  <!-- Status indicators - bottom -->
  <g transform="translate(400, 340)">
    <!-- Status dot 1 -->
    <circle cx="0" cy="0" r="4" fill="#00ffcc" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="5" 
          font-family="'Courier New', monospace" 
          font-size="12" 
          fill="#00d4ff" 
          opacity="0.7">SYSTEM ACTIVE</text>
    
    <!-- Status dot 2 -->
    <circle cx="160" cy="0" r="4" fill="#00ffcc" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <text x="175" y="5" 
          font-family="'Courier New', monospace" 
          font-size="12" 
          fill="#00d4ff" 
          opacity="0.7">MODULES READY</text>
    
    <!-- Status dot 3 -->
    <circle cx="340" cy="0" r="4" fill="#00ffcc" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="355" y="5" 
          font-family="'Courier New', monospace" 
          font-size="12" 
          fill="#00d4ff" 
          opacity="0.7">AI ENABLED</text>
  </g>
  
  <!-- Subtle data stream effect -->
  <g opacity="0.1">
    <line x1="0" y1="150" x2="300" y2="150" stroke="#00ffcc" stroke-width="1" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="1700" y1="300" x2="2000" y2="300" stroke="#00ffcc" stroke-width="1" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>