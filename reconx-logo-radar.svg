<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0C3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00FFCC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.8" />
    </linearGradient>
    
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Radar sweep gradient -->
    <radialGradient id="radarGrad">
      <stop offset="0%" style="stop-color:#00F0C3;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00F0C3;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#0A1E2E"/>
  
  <!-- Main logo group -->
  <g transform="translate(200, 200)">
    
    <!-- Circular radar base -->
    <circle cx="0" cy="0" r="90" 
            fill="#0F1419" 
            opacity="0.8"/>
    
    <!-- Concentric radar circles -->
    <circle cx="0" cy="0" r="85" 
            fill="none" 
            stroke="#00F0C3" 
            stroke-width="1"
            opacity="0.3"/>
    <circle cx="0" cy="0" r="65" 
            fill="none" 
            stroke="#00F0C3" 
            stroke-width="1"
            opacity="0.3"/>
    <circle cx="0" cy="0" r="45" 
            fill="none" 
            stroke="#00F0C3" 
            stroke-width="1"
            opacity="0.3"/>
    <circle cx="0" cy="0" r="25" 
            fill="none" 
            stroke="#00F0C3" 
            stroke-width="1"
            opacity="0.3"/>
    
    <!-- Crosshair lines -->
    <line x1="-85" y1="0" x2="85" y2="0" 
          stroke="#00F0C3" 
          stroke-width="1"
          opacity="0.3"/>
    <line x1="0" y1="-85" x2="0" y2="85" 
          stroke="#00F0C3" 
          stroke-width="1"
          opacity="0.3"/>
    
    <!-- Central symbol - stylized RX -->
    <!-- R shape -->
    <g>
      <path d="M -40,-30 L -40,30 M -40,-30 L -15,-30 Q -5,-30 -5,-20 Q -5,-10 -15,-10 L -40,-10 M -15,-10 L -5,30" 
            stroke="url(#grad1)" 
            stroke-width="5"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#neon)"/>
    </g>
    
    <!-- X shape with scan effect -->
    <g transform="translate(20, 0)">
      <line x1="-25" y1="-30" x2="25" y2="30" 
            stroke="url(#grad1)" 
            stroke-width="5"
            stroke-linecap="round"
            filter="url(#neon)"/>
      <line x1="25" y1="-30" x2="-25" y2="30" 
            stroke="url(#grad1)" 
            stroke-width="5"
            stroke-linecap="round"
            filter="url(#neon)"/>
    </g>
    
    <!-- Target reticle at center -->
    <circle cx="0" cy="0" r="12" 
            fill="none" 
            stroke="#FFD700" 
            stroke-width="2"
            opacity="0.8"/>
    <circle cx="0" cy="0" r="4" 
            fill="#FFD700" 
            opacity="0.9">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Corner markers -->
    <!-- Top-left -->
    <g transform="translate(-65, -65)">
      <line x1="0" y1="0" x2="15" y2="0" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="15" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    
    <!-- Top-right -->
    <g transform="translate(65, -65)">
      <line x1="0" y1="0" x2="-15" y2="0" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="15" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    
    <!-- Bottom-left -->
    <g transform="translate(-65, 65)">
      <line x1="0" y1="0" x2="15" y2="0" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-15" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    
    <!-- Bottom-right -->
    <g transform="translate(65, 65)">
      <line x1="0" y1="0" x2="-15" y2="0" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-15" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    
    <!-- Scanning arc (animated) -->
    <path d="M 0,-85 A 85,85 0 0,1 60,-60" 
          fill="none" 
          stroke="url(#grad2)" 
          stroke-width="2"
          opacity="0.6"
          filter="url(#neon)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="4s"
        repeatCount="indefinite"/>
    </path>
    
    <!-- Outer ring with notches -->
    <circle cx="0" cy="0" r="95" 
            fill="none" 
            stroke="url(#grad1)" 
            stroke-width="2.5"
            stroke-dasharray="5 10"
            opacity="0.6"/>
    
    <!-- Target blips (animated dots) -->
    <circle cx="50" cy="-30" r="3" fill="#FFD700">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-40" cy="50" r="3" fill="#00FF88">
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="40" r="3" fill="#00F0C3">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    
  </g>
  
  <!-- Terminal-style text at bottom -->
  <g opacity="0.7">
    <text x="200" y="360" 
          font-family="'Courier New', monospace" 
          font-size="24" 
          fill="url(#grad1)" 
          text-anchor="middle"
          font-weight="bold"
          letter-spacing="6">RECONX</text>
    <text x="200" y="380" 
          font-family="'Courier New', monospace" 
          font-size="10" 
          fill="#7B8A9E" 
          text-anchor="middle"
          letter-spacing="2">SECURITY RECONNAISSANCE</text>
  </g>
  
</svg>